    <div class="log-content">
        <p>今天对比了递推和递归的效率差异：</p>
        <h3>1. 递推（循环）</h3>
        <p>时间复杂度O(n)，无额外开销，适合简单的递推公式（如a[i] = a[i-1]+a[i-5]）。</p>
        <h3>2. 普通递归</h3>
        <p>因为函数调用栈的开销，比循环慢，且有重复计算问题（如斐波那契递归）。</p>
        <h3>3. 记忆化递归</h3>
        <p>通过缓存已计算的结果，消除重复计算，效率接近循环，但仍有栈开销。</p>
        <p>总结：递推优先用循环，递归适合逻辑复杂的场景（如汉诺塔、二叉树）。</p>
