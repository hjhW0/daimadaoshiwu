        <p>今天学习了Git的核心操作，包括：</p>
        <h3>1. 克隆远程仓库</h3>
        <p>使用 git clone 命令将Gitee上的仓库复制到本地，注意路径不能有中文。</p>
        <h3>2. 提交本地修改</h3>
        <p>通过 git add . 暂存所有修改，git commit -m "说明" 提交到本地仓库。</p>
        <h3>3. 推送到远程</h3>
        <p>使用 git push 把本地提交推送到Gitee，首次推送需要输入账号密码。</p>
        <p>遇到的问题：首次push提示权限不足，后来确认是仓库路径输错了，修正后成功。</p>
